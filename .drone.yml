kind: pipeline
type: docker
name: am-micro

steps:
- name: build
  image: registry.holygrail.com:5000/golang:1.17
  commands:
  - make build
  when:
    branch:
      - v1.0
    event:
      include:
      - push
      - pull_request

- name: docker-build
  image: plugins/docker
  settings:
    repo: registry.holygrail.com:5000/am-micro
    registry: registry.holygrail.com:5000
    insecure: true
    mirror: https://docker.mirrors.ustc.edu.cn/
  when:
    branch:
      - v1.0
    event:
      include:
      - push
      - pull_request

- name: deploy_assassin
  image: appleboy/drone-ssh
  settings:
    host: assassin-hasan.holygrail.com
    username:
      from_secret: assassin_docker_password
    password:
      from_secret: assassin_docker_user
    script:
      - docker stop am-downloader am-downloadmanager am-spider-dmhy am-spider-nyaa am-spider-miobt am-spider-bangumi am-spider-mikanani
      - docker rm am-downloader am-downloadmanager am-spider-dmhy am-spider-nyaa am-spider-miobt am-spider-bangumi am-spider-mikanani
      - docker rmi registry.holygrail.com:5000/am-micro:latest
      - docker-compose -f /store/config/docker-compose/assassin-hasan/docker-compose.yml up -d am-downloader am-downloadmanager am-spider-dmhy am-spider-nyaa am-spider-miobt am-spider-bangumi am-spider-mikanani
  when:
    branch:
      - v1.0
    event:
    - promote
    target:
    - assassin

trigger:
  branch:
  - v1.0